[tool.poetry]
name = "djcaddy"
version = "2.0"
description = "Analisi di una libreria mp3 per DJing: classificazione genere/vibe e phrase boundary suggerite per il posizionamento manuale degli hot cue."
authors = ["Maurizio Spadaccino <mspadaccino@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mutagen = "^1.47"
librosa = "^0.10"
numpy = ">=1.26"
plotly = "^5.22"
demucs = "^4.0"
# La proiezione della mappa (sezione Map). Porta con sé pynndescent;
# numba e llvmlite, che sono il grosso, arrivano già con librosa.
umap-learn = "^0.5"

# Solo per l'app Qt (qt_app/): pin ripreso dal prototipo su qt_test
# (commit 2dd9ff2), che ne conferma la fattibilità dello stack.
[tool.poetry.group.qt.dependencies]
pyside6 = { version = "^6.11", python = ">=3.11,<3.15" }

# La scrittura dei cue nella libreria di rekordbox (core/analysis/rekordbox_write.py).
# Gruppo a sé come essentia: `poetry install --without rekordbox` lascia in
# piedi tutto il resto, e la pagina dei cue lo dice invece di rompersi.
# pyrekordbox porta con sé sqlcipher3-wheels, che è ciò che apre il
# master.db cifrato di rekordbox 6/7.
[tool.poetry.group.rekordbox.dependencies]
pyrekordbox = "^0.4.4"

# Essentia sta in un gruppo suo ma NON opzionale: `poetry install` la prende,
# come tutto il resto. Il gruppo serve solo da via d'uscita, perche' su PyPI
# esiste unicamente come pre-release e solo per certe versioni di Python
# (da qui allow-prereleases: un vincolo tipo ">=2.1b6" non la troverebbe).
# Se un domani manca la wheel per il Python in uso, `poetry install --without
# essentia` tiene in piedi Wave analysis e Folder analysis, che non la usano.
[tool.poetry.group.essentia.dependencies]
essentia-tensorflow = { version = "*", allow-prereleases = true }

# Describe a modello (core/analysis/describe_llm.py): la frase a Claude, il
# modulo indietro. Gruppo a sé come rekordbox: senza, Describe legge a
# regole e basta, e lo dice. `keyring` tiene la chiave dell'utente nel
# portachiavi del sistema invece che in un file.
[tool.poetry.group.describe.dependencies]
anthropic = "^1.4"
keyring = "^25.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-qt = "^4.5.0"
pyinstaller = {version = "^6.22", python = ">=3.11,<3.16"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
